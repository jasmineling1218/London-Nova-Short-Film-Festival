<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feedback Admin — London Nova</title><style>:root{--n:#020d14;--i:#f2eee7;--m:#9eafb3;--g:#cfa85d;--l:rgba(207,168,93,.34);--h:rgba(242,238,231,.11);--max:1280px}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#03121b,#021019);color:var(--i);font-family:Arial,sans-serif;min-height:100vh}.wrap{width:min(var(--max),calc(100% - 38px));margin:auto}header{border-bottom:1px solid var(--h);padding:24px 0}.nav{display:flex;justify-content:space-between}.nav a{color:var(--i);text-decoration:none;font-size:11px;margin-left:18px}.brand{font:22px Georgia,serif;color:#e2c987}.hero{padding:48px 0 24px}h1,h2{font-family:Georgia,serif;font-weight:400}h1{font-size:56px;margin:5px 0}.k{color:var(--g);font-size:10px;letter-spacing:.15em;text-transform:uppercase}.lead,.small,.status{color:var(--m);font-size:12px}.grid{display:grid;grid-template-columns:330px 1fr;gap:18px;padding-bottom:80px}.list,.work{border:1px solid var(--h);background:rgba(2,13,20,.55)}.search{padding:15px;border-bottom:1px solid var(--h)}input,textarea{width:100%;background:rgba(0,0,0,.2);border:1px solid var(--h);color:var(--i);padding:12px}.sub{width:100%;padding:15px;text-align:left;background:none;color:var(--i);border:0;border-bottom:1px solid var(--h);cursor:pointer}.sub:hover,.sub.active{background:rgba(207,168,93,.07)}.sub strong{display:block;font:18px Georgia,serif}.sub span{font-size:10px;color:var(--m)}.head{padding:20px;border-bottom:1px solid var(--h)}.body{display:grid;grid-template-columns:1fr 1fr}.pane{padding:20px}.pane:first-child{border-right:1px solid var(--h)}textarea{min-height:330px;resize:vertical}.reply textarea{min-height:100px}.btn{border:1px solid var(--g);background:none;color:var(--i);padding:10px 14px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}.primary{background:var(--g);color:#07131a}.actions{display:flex;gap:10px;align-items:center;margin-top:10px}.message{border:1px solid var(--h);padding:11px;margin-bottom:8px}.message.admin{border-color:var(--l);background:rgba(207,168,93,.05)}.mt{display:flex;justify-content:space-between;color:var(--g);font-size:9px}.message p{white-space:pre-wrap;font-size:12px}.placeholder{padding:32px;color:var(--m)}@media(max-width:900px){.grid,.body{grid-template-columns:1fr}.pane:first-child{border-right:0;border-bottom:1px solid var(--h)}}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html">LONDON NOVA · REVIEW DESK</a><div><a href="dashboard.html">Dashboard</a><a href="feedback.html">Filmmaker View</a></div></div></header><main><section class="hero"><div class="wrap"><div class="k">Admin only</div><h1>FEEDBACK DESK</h1><p class="lead">Publish detailed feedback for each submission and answer filmmaker questions.</p></div></section><div class="wrap"><div id="status" class="status">Checking access…</div><div id="adminGrid" class="grid" hidden><aside class="list"><div class="search"><input id="search" placeholder="Search film title…"></div><div id="submissionList"></div></aside><section class="work" id="workspace"><div class="placeholder">Choose a submission to review.</div></section></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin-feedback.js"></script></body></html>
