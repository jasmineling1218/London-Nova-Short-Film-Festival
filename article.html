<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story — London Nova</title><style>:root{--night:#020d14;--ivory:#f2eee7;--muted:#a7b5b8;--gold:#cfa85d;--gold-soft:#e2c987;--hair:rgba(242,238,231,.12);--line:rgba(207,168,93,.34);--max:1180px}*{box-sizing:border-box}body{margin:0;color:var(--ivory);background:radial-gradient(circle at 75% 10%,rgba(16,74,89,.22),transparent 25%),linear-gradient(180deg,#03121b,#021019);font-family:Inter,"Helvetica Neue",Arial,sans-serif;line-height:1.65;min-height:100vh}a{color:inherit;text-decoration:none}.wrap{width:min(var(--max),calc(100% - 64px));margin:auto}header{position:sticky;top:0;z-index:20;background:rgba(2,13,20,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--hair)}.nav{min-height:82px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:14px}.brand img{width:88px}.brand-title{font:22px Georgia,serif;color:var(--gold-soft)}.brand-title span{display:block;font:10px Inter,Arial,sans-serif;letter-spacing:.13em;margin-top:5px}.back{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold-soft)}.head{padding:90px 0 48px}.meta{color:var(--gold);font-size:10px;letter-spacing:.16em;text-transform:uppercase;display:flex;gap:14px}.head h1{font:400 clamp(46px,7vw,92px)/.95 Georgia,serif;letter-spacing:-.04em;margin:22px 0;max-width:1000px}.dek{max-width:760px;color:#cbd5d7;font-size:17px}.hero{margin:25px auto 60px}.hero img{width:100%;max-height:760px;object-fit:cover;border:1px solid var(--hair)}.article{width:min(760px,calc(100% - 34px));margin:0 auto 110px;font:20px/1.7 Georgia,"Times New Roman",serif;color:#d9e0e1}.article p{margin:0 0 28px}.article img{width:100%;display:block;margin:42px 0;border:1px solid var(--hair)}.video{position:relative;padding-top:56.25%;margin:44px 0}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.state{padding:100px 0;color:var(--muted)}footer{border-top:1px solid var(--hair);padding:35px 0;color:var(--muted);font-size:11px}@media(max-width:720px){.wrap{width:min(100% - 34px,var(--max))}.brand img{width:65px}.brand-title{font-size:16px}.article{font-size:18px}}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html"><img src="london-nova-wave-film-emblem.png" alt="London Nova"><div class="brand-title">LONDON NOVA<span>SHORT FILM FESTIVAL</span></div></a><a class="back" href="news.html">← News & Events</a></div></header><main id="story"><div class="wrap state">Loading story…</div></main><footer><div class="wrap">© 2026 London Nova Short Film Festival · <a href="https://www.instagram.com/novafilmfestival" target="_blank" rel="noopener noreferrer">Instagram</a></div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const fmt=d=>new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});function embed(u){try{const x=new URL(u);if(x.hostname.includes('youtube.com')&&x.searchParams.get('v'))return'https://www.youtube.com/embed/'+x.searchParams.get('v');if(x.hostname==='youtu.be')return'https://www.youtube.com/embed/'+x.pathname.slice(1);if(x.hostname.includes('vimeo.com'))return'https://player.vimeo.com/video/'+x.pathname.split('/').filter(Boolean).pop();return u}catch{return''}}function blocks(t){return String(t||'').split(/\n{2,}/).map(b=>{b=b.trim();if(/^IMAGE:\s*/i.test(b))return`<img src="${esc(b.replace(/^IMAGE:\s*/i,''))}" alt="">`;if(/^VIDEO:\s*/i.test(b)){const u=embed(b.replace(/^VIDEO:\s*/i,'').trim());return u?`<div class="video"><iframe src="${esc(u)}" allowfullscreen></iframe></div>`:''}return b?`<p>${esc(b).replace(/\n/g,'<br>')}</p>`:''}).join('')}(async()=>{const main=document.getElementById('story');try{const slug=new URLSearchParams(location.search).get('slug');const client=supabase.createClient(LN_CONFIG.SUPABASE_URL,LN_CONFIG.SUPABASE_PUBLISHABLE_KEY);const {data:x,error}=await client.from('news_articles').select('*').eq('slug',slug).eq('status','published').maybeSingle();if(error)throw error;if(!x){main.innerHTML='<div class="wrap state">Story not found.</div>';return}document.title=x.title+' — London Nova';main.innerHTML=`<section class="head"><div class="wrap"><div class="meta"><span>${esc(x.category||'News')}</span><time>${fmt(x.published_at)}</time></div><h1>${esc(x.title)}</h1><p class="dek">${esc(x.excerpt||'')}</p></div></section>${x.cover_image_url?`<div class="hero wrap"><img src="${esc(x.cover_image_url)}" alt=""></div>`:''}<article class="article">${blocks(x.content)}${x.video_url?`<div class="video"><iframe src="${esc(embed(x.video_url))}" allowfullscreen></iframe></div>`:''}</article>`}catch(e){console.error(e);main.innerHTML='<div class="wrap state">Story could not be loaded.</div>'}})();</script></body></html>
