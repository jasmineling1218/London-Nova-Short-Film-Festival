<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story — London Nova</title><style>:root{--night:#020d14;--ivory:#f2eee7;--muted:#a7b5b8;--gold:#cfa85d;--gold-soft:#e2c987;--hair:rgba(242,238,231,.12);--line:rgba(207,168,93,.34);--max:1180px}*{box-sizing:border-box}body{margin:0;color:var(--ivory);background:radial-gradient(circle at 75% 10%,rgba(16,74,89,.22),transparent 25%),linear-gradient(180deg,#03121b,#021019);font-family:Inter,"Helvetica Neue",Arial,sans-serif;line-height:1.65;min-height:100vh}a{color:inherit}.wrap{width:min(var(--max),calc(100% - 64px));margin:auto}header{position:sticky;top:0;z-index:20;background:rgba(2,13,20,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--hair)}.nav{min-height:82px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:14px;text-decoration:none}.brand img{width:88px}.brand-title{font:22px Georgia,serif;color:var(--gold-soft)}.brand-title span{display:block;font:10px Inter,Arial,sans-serif;letter-spacing:.13em;margin-top:5px}.back{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold-soft);text-decoration:none}.previewbar{background:#cfa85d;color:#071016;padding:7px;text-align:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase}.head{padding:64px 0 30px}.meta{color:var(--gold);font-size:10px;letter-spacing:.16em;text-transform:uppercase;display:flex;gap:14px}.head h1{font:400 clamp(44px,6.3vw,84px)/.96 Georgia,serif;letter-spacing:-.04em;margin:18px 0 16px;max-width:1000px}.dek{max-width:760px;color:#cbd5d7;font-size:17px;margin:0}.hero{width:min(980px,calc(100% - 64px));margin:18px auto 42px;display:flex;justify-content:center}.hero img{display:block;width:auto;max-width:100%;max-height:610px;object-fit:contain;border:1px solid var(--hair);background:rgba(1,10,15,.35)}.article{width:min(780px,calc(100% - 34px));margin:0 auto 84px;color:#d9e0e1}.b{box-sizing:border-box}.b-text{font:19px/1.68 Georgia,"Times New Roman",serif}.b-heading{font-family:Georgia,serif;line-height:1.12;color:var(--ivory)}.b-heading.h2{font-size:40px}.b-heading.h3{font-size:29px}.b-quote{font:italic 23px/1.5 Georgia,serif;border-left:2px solid var(--gold);padding-left:24px;color:#e5ddcf}.b-media{display:flex;flex-direction:column}.b-media.left{align-items:flex-start}.b-media.center{align-items:center}.b-media.right{align-items:flex-end}.b-media img,.b-media video{max-width:100%;height:auto;border:1px solid var(--hair)}.caption{font:11px/1.5 Inter,Arial,sans-serif;color:var(--muted);margin-top:9px}.video-frame{position:relative;padding-top:56.25%;width:100%}.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.divider{height:1px;background:var(--line)}.state{padding:100px 0;color:var(--muted)}footer{border-top:1px solid var(--hair);padding:35px 0;color:var(--muted);font-size:11px}@media(max-width:720px){.wrap{width:min(100% - 34px,var(--max))}.brand img{width:65px}.brand-title{font-size:16px}.head{padding:46px 0 22px}.hero{width:calc(100% - 34px);margin:12px auto 30px}.article{margin-bottom:64px}.b-text{font-size:18px}.b-heading.h2{font-size:34px}.b-heading.h3{font-size:27px}}</style></head><body><div id="previewbar"></div><header><div class="wrap nav"><a class="brand" href="index.html"><img src="london-nova-wave-film-emblem.png" alt="London Nova"><div class="brand-title">LONDON NOVA<span>SHORT FILM FESTIVAL</span></div></a><a class="back" href="news.html">← News & Events</a></div></header><main id="story"><div class="wrap state">Loading story…</div></main><footer><div class="wrap">© 2026 London Nova Short Film Festival · <a href="https://www.instagram.com/novafilmfestival" target="_blank" rel="noopener noreferrer">Instagram</a></div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const fmt=d=>d?new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'}):'Draft preview';function embed(u){try{const x=new URL(u);if(x.hostname.includes('youtube.com')&&x.searchParams.get('v'))return'https://www.youtube.com/embed/'+x.searchParams.get('v');if(x.hostname==='youtu.be')return'https://www.youtube.com/embed/'+x.pathname.slice(1);if(x.hostname.includes('vimeo.com'))return'https://player.vimeo.com/video/'+x.pathname.split('/').filter(Boolean).pop();return''}catch{return''}}function isDirectVideo(u){return /\.(mp4|webm)(\?|$)/i.test(u||'')}
function safeRich(html){const t=document.createElement('template');t.innerHTML=html||'';const allowed=new Set(['B','STRONG','I','EM','A','BR']);[...t.content.querySelectorAll('*')].forEach(n=>{if(!allowed.has(n.tagName)){n.replaceWith(...n.childNodes);return}[...n.attributes].forEach(a=>{if(!(n.tagName==='A'&&a.name==='href'))n.removeAttribute(a.name)});if(n.tagName==='A'){n.setAttribute('target','_blank');n.setAttribute('rel','noopener noreferrer')}});return t.innerHTML}
function space(v,max=96){return Math.min(max,Math.max(0,Number(v||0)))}function alignStyle(b){return`text-align:${['left','center','right'].includes(b.align)?b.align:'left'};margin-top:${space(b.mt)}px;margin-bottom:${space(b.mb)}px`}
function renderBlock(b){if(!b||!b.type)return'';if(b.type==='paragraph')return`<div class="b b-text" style="${alignStyle(b)}">${safeRich(b.html)}</div>`;if(b.type==='heading'){const lvl=Number(b.level)===3?'h3':'h2';return`<div class="b b-heading ${lvl}" style="${alignStyle(b)}">${safeRich(b.html)}</div>`}if(b.type==='quote')return`<div class="b b-quote" style="${alignStyle(b)}">${safeRich(b.html)}</div>`;if(b.type==='image'){if(!b.url)return'';const w=Math.min(100,Math.max(20,Number(b.width||100)));const a=['left','center','right'].includes(b.align)?b.align:'center';return`<div class="b b-media ${a}" style="margin-top:${space(b.mt)}px;margin-bottom:${space(b.mb)}px"><img src="${esc(b.url)}" alt="${esc(b.alt||'')}" style="width:${w}%">${b.caption?`<div class="caption" style="width:${w}%">${esc(b.caption)}</div>`:''}</div>`}if(b.type==='video'){if(!b.url)return'';const w=Math.min(100,Math.max(20,Number(b.width||100)));const a=['left','center','right'].includes(b.align)?b.align:'center';const em=embed(b.url);let media=isDirectVideo(b.url)?`<video src="${esc(b.url)}" controls playsinline style="width:100%"></video>`:em?`<div class="video-frame"><iframe src="${esc(em)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>`:`<a href="${esc(b.url)}" target="_blank" rel="noopener noreferrer">Open video</a>`;return`<div class="b b-media ${a}" style="margin-top:${space(b.mt)}px;margin-bottom:${space(b.mb)}px"><div style="width:${w}%">${media}${b.caption?`<div class="caption">${esc(b.caption)}</div>`:''}</div></div>`}if(b.type==='divider')return`<div class="b divider" style="margin-top:${space(b.mt||28)}px;margin-bottom:${space(b.mb||28)}px"></div>`;if(b.type==='spacer')return`<div aria-hidden="true" style="height:${Math.min(120,Math.max(8,Number(b.height||32)))}px"></div>`;return''}
function legacyBlocks(t){return String(t||'').split(/\n{2,}/).map(b=>b.trim()?`<div class="b b-text" style="margin-bottom:28px">${esc(b).replace(/\n/g,'<br>')}</div>`:'').join('')}
function contentHTML(t){try{const x=JSON.parse(t||'');if(x&&x.version===4&&Array.isArray(x.blocks))return x.blocks.map(renderBlock).join('')}catch{}return legacyBlocks(t)}
(async()=>{const main=document.getElementById('story');try{const qs=new URLSearchParams(location.search),preview=qs.get('preview'),slug=qs.get('slug');const client=supabase.createClient(LN_CONFIG.SUPABASE_URL,LN_CONFIG.SUPABASE_PUBLISHABLE_KEY);let x,error;if(preview){const {data:{user}}=await client.auth.getUser();if(!user)throw new Error('Sign in required');const a=await client.rpc('is_admin');if(a.error||a.data!==true)throw new Error('Admin access required');({data:x,error}=await client.from('news_articles').select('*').eq('id',preview).maybeSingle());document.getElementById('previewbar').innerHTML='<div class="previewbar">Editorial Preview · This page is not public unless published</div>'}else{({data:x,error}=await client.from('news_articles').select('*').eq('slug',slug).eq('status','published').maybeSingle())}if(error)throw error;if(!x){main.innerHTML='<div class="wrap state">Story not found.</div>';return}document.title=x.title+' — London Nova';main.innerHTML=`<section class="head"><div class="wrap"><div class="meta"><span>${esc(x.category||'News')}</span><time>${fmt(x.published_at)}</time></div><h1>${esc(x.title)}</h1><p class="dek">${esc(x.excerpt||'')}</p></div></section>${x.cover_image_url?`<div class="hero wrap"><img src="${esc(x.cover_image_url)}" alt=""></div>`:''}<article class="article">${contentHTML(x.content)}</article>`}catch(e){console.error(e);main.innerHTML='<div class="wrap state">'+esc(e.message||'Story could not be loaded.')+'</div>'}})();</script></body></html>
