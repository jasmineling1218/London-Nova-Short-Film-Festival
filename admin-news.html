<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editorial — London Nova</title><style>:root{--night:#020d14;--ivory:#f2eee7;--muted:#a7b5b8;--gold:#cfa85d;--gold-soft:#e2c987;--hair:rgba(242,238,231,.12);--line:rgba(207,168,93,.34);--max:1240px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 7%,rgba(16,74,89,.24),transparent 24%),linear-gradient(180deg,#03121b,#021019);color:var(--ivory);font-family:Inter,"Helvetica Neue",Arial,sans-serif;min-height:100vh}a{color:inherit;text-decoration:none}.wrap{width:min(var(--max),calc(100% - 56px));margin:auto}header{border-bottom:1px solid var(--hair);background:rgba(2,13,20,.88)}.nav{min-height:82px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:14px;align-items:center}.brand img{width:82px}.brand div{font:22px Georgia,serif;color:var(--gold-soft)}.brand span{display:block;font:10px Inter,Arial,sans-serif;letter-spacing:.15em}.small{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold-soft)}main{padding:70px 0 100px}.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}h1{font:400 clamp(44px,6vw,76px)/.95 Georgia,serif;margin:14px 0 40px}.panel{border:1px solid var(--hair);background:rgba(2,13,20,.45);padding:30px;margin-bottom:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:flex;flex-direction:column;gap:8px}.full{grid-column:1/-1}label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}input,select,textarea{width:100%;background:rgba(0,10,15,.72);border:1px solid var(--hair);color:var(--ivory);padding:13px 14px;font:14px Inter,Arial,sans-serif}textarea{min-height:220px;resize:vertical}.hint,.status{color:var(--muted);font-size:11px;line-height:1.6}.actions,.row-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{border:1px solid var(--gold);background:transparent;color:var(--ivory);padding:12px 18px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}.danger{border-color:rgba(210,100,100,.55)}.row{border-top:1px solid var(--hair);padding:18px 0;display:grid;grid-template-columns:1fr auto;gap:20px}.row h3{font:400 24px Georgia,serif;margin:6px 0}.locked{padding:110px 0;text-align:center;color:var(--muted)}@media(max-width:760px){.grid,.row{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html"><img src="london-nova-wave-film-emblem.png" alt="London Nova"><div>LONDON NOVA<span>EDITORIAL</span></div></a><a class="small" href="news.html">View News & Events →</a></div></header><main class="wrap"><div id="gate" class="locked">Checking editorial access…</div><div id="app" hidden><div class="eyebrow">London Nova · Editorial CMS</div><h1>NEWS &amp;<br>EVENTS</h1><section class="panel"><input type="hidden" id="id"><div class="grid"><div class="field"><label>Title</label><input id="title"></div><div class="field"><label>Slug</label><input id="slug" placeholder="open-call-2026"></div><div class="field"><label>Category</label><select id="category"><option>News</option><option>Event</option><option>Open Call</option><option>Announcement</option><option>Festival Journal</option><option>Screening</option></select></div><div class="field"><label>Cover image URL</label><input id="cover" type="url"></div><div class="field full"><label>Excerpt</label><textarea id="excerpt" style="min-height:90px"></textarea></div><div class="field full"><label>Article content</label><textarea id="content"></textarea><div class="hint">Add extra media on its own paragraph with <b>IMAGE: https://…</b> or <b>VIDEO: https://…</b>.</div></div><div class="field full"><label>Main video URL</label><input id="video" type="url"></div></div><div class="actions"><button class="btn" id="new">New Article</button><button class="btn" id="draft">Save Draft</button><button class="btn" id="publish">Publish</button></div><div id="msg" class="status"></div></section><section class="panel"><div class="eyebrow">Existing articles</div><div id="list"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const $=x=>document.getElementById(x),client=supabase.createClient(LN_CONFIG.SUPABASE_URL,LN_CONFIG.SUPABASE_PUBLISHABLE_KEY);const slugify=s=>s.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');function clear(){['id','title','slug','cover','excerpt','content','video'].forEach(x=>$(x).value='');$('category').value='News';$('msg').textContent='New article.'}function fill(r){$('id').value=r.id;$('title').value=r.title||'';$('slug').value=r.slug||'';$('category').value=r.category||'News';$('cover').value=r.cover_image_url||'';$('excerpt').value=r.excerpt||'';$('content').value=r.content||'';$('video').value=r.video_url||'';scrollTo({top:0,behavior:'smooth'})}async function save(status){const d={title:$('title').value.trim(),slug:$('slug').value.trim()||slugify($('title').value),category:$('category').value,cover_image_url:$('cover').value.trim()||null,excerpt:$('excerpt').value.trim(),content:$('content').value,video_url:$('video').value.trim()||null,status};if(status==='published')d.published_at=new Date().toISOString();if(!d.title||!d.slug){$('msg').textContent='Title and slug are required.';return}const id=$('id').value;const q=id?client.from('news_articles').update(d).eq('id',id).select().single():client.from('news_articles').insert(d).select().single();const {data,error}=await q;$('msg').textContent=error?error.message:(status==='published'?'Published.':'Draft saved.');if(data){$('id').value=data.id;load()}}async function load(){const {data,error}=await client.from('news_articles').select('*').order('updated_at',{ascending:false});if(error){$('list').innerHTML=error.message;return}$('list').innerHTML='';(data||[]).forEach(r=>{const el=document.createElement('div');el.className='row';el.innerHTML=`<div><div class="eyebrow">${r.status} · ${r.category||'News'}</div><h3>${r.title}</h3><div class="status">${r.slug}</div></div><div class="row-actions"><button class="btn edit">Edit</button><button class="btn danger del">Delete</button></div>`;el.querySelector('.edit').onclick=()=>fill(r);el.querySelector('.del').onclick=async()=>{if(confirm('Delete this article?')){const {error}=await client.from('news_articles').delete().eq('id',r.id);if(error)alert(error.message);else load()}};$('list').appendChild(el)})}async function init(){const {data:{user}}=await client.auth.getUser();if(!user||user.is_anonymous){$('gate').textContent='Please sign in with your London Nova admin account first.';return}const {data,error}=await client.rpc('is_admin');if(error||data!==true){$('gate').textContent='This account does not have editorial access.';return}$('gate').hidden=true;$('app').hidden=false;load()}$('title').onblur=()=>{if(!$('slug').value)$('slug').value=slugify($('title').value)};$('new').onclick=e=>{e.preventDefault();clear()};$('draft').onclick=e=>{e.preventDefault();save('draft')};$('publish').onclick=e=>{e.preventDefault();save('published')};init();</script></body></html>
