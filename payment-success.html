<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Submission Confirmation — London Nova</title><style>
:root{--night:#020d14;--ivory:#f2eee7;--muted:#a7b5b8;--gold:#cfa85d;--gold-soft:#e2c987;--hair:rgba(242,238,231,.12);--ok:#b9d6be;--danger:#d9a0a0;--max:1120px}*{box-sizing:border-box}html{background:var(--night)}body{margin:0;color:var(--ivory);font-family:Inter,"Helvetica Neue",Arial,sans-serif;line-height:1.55;background:radial-gradient(circle at 78% 8%,rgba(157,202,214,.10),transparent 24%),radial-gradient(circle at 18% 35%,rgba(20,74,89,.30),transparent 30%),linear-gradient(180deg,#03121b,#041822 38%,#021019);min-height:100vh}.wrap{width:min(900px,calc(100% - 40px));margin:auto}.hero{padding:76px 0}.kicker{color:var(--gold);font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:14px}h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(46px,8vw,86px);line-height:.96;margin:0 0 24px}.lead{max-width:800px;color:#cbd5d7;font-size:17px}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--gold);background:transparent;color:var(--ivory);padding:13px 20px;min-height:46px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;margin:4px 6px 4px 0}.btn.primary{background:var(--gold);color:#07131a}.confirmation{margin:34px 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:24px 0}.status{font-family:Georgia,serif;font-size:23px;color:var(--gold-soft)}.status.ok{color:var(--ok)}.status.error{color:var(--danger)}.details{margin-top:16px;color:var(--muted);font-size:13px}.details strong{color:var(--ivory)}
</style></head><body><main><section class="hero"><div class="wrap"><div class="kicker">Direct Submission</div><h1 id="title">CONFIRMING PAYMENT</h1><p id="lead" class="lead">Stripe has returned you to London Nova. We are checking the secure payment confirmation in our database.</p><div class="confirmation"><div id="state" class="status">Confirming your submission…</div><div id="details" class="details"></div></div><p><a class="btn primary" href="dashboard.html">View My Submissions</a><a class="btn" href="index.html">Festival Home</a></p></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
(async()=>{
 const sb=supabase.createClient(LN_CONFIG.SUPABASE_URL,LN_CONFIG.SUPABASE_PUBLISHABLE_KEY);
 const sessionId=new URLSearchParams(location.search).get('session_id');
 const title=document.getElementById('title'), lead=document.getElementById('lead'), state=document.getElementById('state'), details=document.getElementById('details');
 if(!sessionId){title.textContent='PAYMENT RETURNED';state.textContent='Open My Submissions to check the latest status.';return;}
 for(let i=0;i<10;i++){
   const {data,error}=await sb.from('submissions').select('id,film_title,status,payment_status,amount_paid_pence,submitted_at').eq('stripe_checkout_session_id',sessionId).maybeSingle();
   if(!error && data && data.payment_status==='paid' && data.status==='submitted'){
     title.textContent='SUBMISSION CONFIRMED';
     lead.textContent='Payment confirmed. Your film has been successfully submitted to London Nova Short Film Festival.';
     state.textContent='Payment confirmed · Submission received'; state.className='status ok';
     details.innerHTML=`<p><strong>Film:</strong> ${data.film_title||'Untitled film'}</p><p><strong>Submission ID:</strong> ${data.id}</p><p><strong>Amount paid:</strong> £${((data.amount_paid_pence||0)/100).toFixed(2)}</p><p><strong>Submitted:</strong> ${data.submitted_at?new Date(data.submitted_at).toLocaleString():'Confirmed'}</p>`;
     return;
   }
   await new Promise(r=>setTimeout(r,1200));
 }
 title.textContent='PAYMENT RECEIVED';
 lead.textContent='Stripe has returned you to London Nova. Payment confirmation is still processing.';
 state.textContent='Confirmation is taking a little longer than usual. Please check My Submissions in a moment.';
})();
</script></body></html>
