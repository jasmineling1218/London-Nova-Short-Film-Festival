<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment Received — London Nova</title><style>
:root{--night:#020d14;--ivory:#f2eee7;--muted:#a7b5b8;--gold:#cfa85d;--gold-soft:#e2c987;--line:rgba(207,168,93,.34);--hair:rgba(242,238,231,.12);--panel:rgba(5,28,38,.62);--danger:#d9a0a0;--ok:#b9d6be;--max:1120px}
*{box-sizing:border-box}html{background:var(--night)}body{margin:0;color:var(--ivory);font-family:Inter,"Helvetica Neue",Arial,sans-serif;line-height:1.55;background:radial-gradient(circle at 78% 8%,rgba(157,202,214,.10),transparent 24%),radial-gradient(circle at 18% 35%,rgba(20,74,89,.30),transparent 30%),linear-gradient(180deg,#03121b,#041822 38%,#021019);min-height:100vh}a{color:inherit;text-decoration:none}.wrap{width:min(var(--max),calc(100% - 40px));margin:auto}
header{position:sticky;top:0;z-index:20;background:rgba(2,13,20,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--hair)}.nav{min-height:84px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{display:flex;align-items:center;gap:14px}.brand img{width:90px;height:52px;object-fit:contain}.brand-title{font-family:Georgia,serif;font-size:23px;line-height:.94;background:linear-gradient(#f0d89f,#c99d4e 58%,#edce85);-webkit-background-clip:text;color:transparent}.brand-title span{display:block;font-size:.67em;letter-spacing:.11em;margin-top:5px}.nav-actions{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--gold);background:transparent;color:var(--ivory);padding:12px 18px;min-height:44px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}.btn:hover{background:rgba(207,168,93,.08)}.btn.primary{background:var(--gold);color:#07131a}.btn[disabled]{opacity:.45;cursor:not-allowed}
.hero{padding:72px 0 36px}.kicker{color:var(--gold);font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:14px}h1,h2,h3{font-family:Georgia,serif;font-weight:400}h1{font-size:clamp(44px,7vw,76px);line-height:.96;margin:0 0 20px}h2{font-size:30px;margin:0 0 18px}.lead{max-width:760px;color:#cbd5d7}
.grid{display:grid;grid-template-columns:1fr 320px;gap:28px;padding-bottom:90px}.panel{border:1px solid var(--hair);background:rgba(2,13,20,.48);padding:28px}.panel+.panel{margin-top:18px}
label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-soft);margin:18px 0 7px}.req:after{content:" *";color:var(--gold)}input,textarea,select{width:100%;border:1px solid rgba(242,238,231,.16);background:rgba(0,0,0,.18);color:var(--ivory);padding:13px 14px;font:inherit;border-radius:0}textarea{min-height:120px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:8px}.check{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--hair);padding:11px}.check input{width:auto;margin-top:4px}.check label{margin:0;color:#d3dcde;text-transform:none;letter-spacing:0;font-size:13px}
.help{font-size:12px;color:var(--muted);margin-top:7px}.status{font-size:12px;margin:12px 0}.ok{color:var(--ok)}.error{color:var(--danger)}.side{position:sticky;top:108px;align-self:start}.summary{font-size:13px;color:#cbd5d7}.summary strong{color:var(--ivory)}.pill{display:inline-block;border:1px solid var(--line);color:var(--gold-soft);padding:5px 8px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin:3px 4px 3px 0}.divider{border-top:1px solid var(--hair);margin:22px 0}.authbox{display:flex;gap:10px;flex-wrap:wrap}.small{font-size:11px;color:var(--muted)}footer{border-top:1px solid var(--hair);padding:28px 0;color:#718083;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
@media(max-width:850px){.grid{grid-template-columns:1fr}.side{position:static}.row,.checks{grid-template-columns:1fr}.brand-title{font-size:17px}.brand img{width:70px;height:42px}.nav-actions .hide-mobile{display:none}}
</style></head>
<body><main><section class="hero"><div class="wrap" style="max-width:800px"><div class="kicker">Direct Submission</div><h1>PAYMENT RECEIVED</h1><p class="lead">Thank you. Stripe has returned you to London Nova. Your submission is only marked as successfully submitted after our secure payment webhook confirms the payment in the database.</p><p><a class="btn primary" href="dashboard.html">View My Submissions</a> <a class="btn" href="index.html">Festival Home</a></p></div></section></main></body></html>
